# CAPTURE.WebScraper — per-site rules. [DEFAULT] applies to every host; a section
# named after a host (no "www.") overrides it for that host. The site's own
# robots.txt is ALWAYS read and obeyed on top of these (respect_robots = true);
# extra_disallow is for paths a site does not list but are not worth fetching.
# Pass another file with --config.

[DEFAULT]
user_agent = Mozilla/5.0 (X11; Linux x86_64) WebScraper/2.0 (personal archive)
# Minimum seconds between two requests to one host, across ALL workers.
# robots.txt Crawl-delay raises it, never lowers it.
request_delay = 0.5
threads = 4
max_file_size_mb = 2
timeout = 20
respect_robots = true
# Query strings are dropped (dedup). true for a site that paginates by ?page=.
keep_query = false
# Media is fetched only from the target host and the hosts listed here.
media_hosts =
extra_disallow =

[recordinghacks.com]
# The microphone database behind scrapes/microphones*. These were the
# compiled-in DISALLOWED_PATHS until 2026-10-30: the paths of its robots.txt at
# the time, plus listings not worth fetching. Its live robots.txt is read too.
extra_disallow = /wp-admin/, /wp-includes/, /wp-images/, /feed/, /category/,
    /internal/, /scripts/, /sendmessage.php, /mic_share, /page/, /rnf,
    /regional, /images/albumcovers/, /microphones/tag/condenser,
    /microphones/tag/side-address

[specs.amwa.tv]
# AMWA NMOS specs (scrapes/specs-amwa-tv-*). Static GitHub Pages; nothing extra.
